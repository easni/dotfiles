# Only manage the display around system sleep; no idle timeouts.
# Keep the clean display-off transition, then recover locked-screen redraws.
# hypridle 0.1.8 reports "No rules configured" with no idle listeners;
# the sleep hooks still run.
general {
    inhibit_sleep = 1
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    after_sleep_cmd = bash "$HOME/.config/hypr/scripts/resume-display.sh"
}
