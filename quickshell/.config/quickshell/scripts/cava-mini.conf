# A dedicated full-spectrum feed for the island's five bars.
[general]
bars = 5
framerate = 60
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 77
